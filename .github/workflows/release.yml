# Builds installers for Windows, macOS and Linux with electron-builder and
# attaches them to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0     -> builds + publishes the release
#   Actions > Release > Run workflow              -> builds artifacts only (no release)
#
# Builds are unsigned: macOS users must right-click > Open the first time (or
# run `xattr -dr com.apple.quarantine "/Applications/PDF Editor.app"`), and
# Windows SmartScreen shows "More info > Run anyway". See docs/INSTALL.md.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            args: --linux
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac --x64 --arm64
    env:
      # No code-signing certificates: never try to discover an identity.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build renderer and Electron bundles
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
            # electron-builder's own debug dump also lands in release/.
            !release/builder-debug.yml

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body: |
            Unsigned builds. **macOS:** right-click the app and choose *Open* the first time
            (or run `xattr -dr com.apple.quarantine "/Applications/PDF Editor.app"`).
            **Windows:** if SmartScreen appears, choose *More info* → *Run anyway*.
            **Linux:** `chmod +x PDF-Editor-*.AppImage` or install the `.deb`.
            See `docs/INSTALL.md` for details.
